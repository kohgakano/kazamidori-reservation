<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご予約</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --teal:      #2a7a6f;
    --teal-light:#e8f4f2;
    --teal-mid:  #4aab9c;
    --full:      #f5e6e6;
    --full-text: #c0392b;
    --warn:      #fff8e1;
    --warn-text: #e67e00;
    --open:      #e8f4f2;
    --open-text: #2a7a6f;
    --border:    #d0d0d0;
    --text:      #2c2c2c;
    --sub:       #777;
    --radius:    8px;
    --font:      'Hiragino Sans', 'Noto Sans JP', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: #f4f6f5; color: var(--text); font-size: 14px; }

  /* ヘッダー */
  header {
    background: var(--teal); color: #fff;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .today-label { font-size: 13px; opacity: .85; }

  /* 受付時間外画面 */
  .outside-screen {
    display: none; position: fixed; inset: 0; background: #fff;
    z-index: 400; flex-direction: column; align-items: center;
    justify-content: center; padding: 32px; text-align: center;
  }
  .outside-screen.open { display: flex; }
  .outside-icon { font-size: 60px; margin-bottom: 16px; }
  .outside-screen h2 { font-size: 20px; font-weight: 700; color: #555; margin-bottom: 12px; }
  .outside-screen p { color: var(--sub); font-size: 14px; line-height: 1.8; }
  .next-open-badge {
    background: var(--teal-light); border-radius: var(--radius);
    padding: 14px 24px; margin: 20px 0; font-size: 16px;
    font-weight: 700; color: var(--teal);
  }

  /* 当日スロット一覧 */
  .slots-wrap { padding: 12px; }
  .date-header {
    background: #fff; border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: space-between;
  }
  .date-header-main { font-size: 17px; font-weight: 700; color: var(--teal); }
  .date-header-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .reception-closed-notice {
    background: #f5e6e6; border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px; color: #c0392b;
    font-size: 14px; font-weight: 600; text-align: center;
  }

  .slots-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  .slot-item {
    background: #fff; border-radius: var(--radius);
    border: 2px solid var(--border);
    padding: 14px 12px; cursor: pointer;
    transition: all .15s; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .slot-item.open { border-color: var(--teal); }
  .slot-item.open:active { transform: scale(.97); }
  .slot-item.warn { border-color: #e6a817; }
  .slot-item.full { border-color: #e3c4c4; background: #fafafa; cursor: pointer; opacity: .85; }
  .full-notice {
    background: #fdecea; color: #c0392b; border-radius: var(--radius);
    padding: 10px 12px; font-size: 12px; font-weight: 700; line-height: 1.6;
  }
  .slot-item.past { border-color: #e0e0e0; background: #f5f5f5; cursor: default; opacity: .55; }
  .slot-item.closed-slot { border-color: #e0e0e0; background: #f5f5f5; cursor: default; }
  .slot-item.selected { background: var(--teal-light); border-color: var(--teal); box-shadow: 0 0 0 3px rgba(42,122,111,.2); }

  .slot-time { font-size: 15px; font-weight: 700; color: var(--text); }
  .slot-end  { font-size: 11px; color: var(--sub); }
  .slot-mark { font-size: 22px; font-weight: 700; line-height: 1; }
  .slot-mark.mark-open { color: var(--open-text); }
  .slot-mark.mark-warn { color: #e6a817; }
  .slot-mark.mark-full { color: var(--full-text); }
  .slot-mark.mark-past { color: #ccc; }
  .slot-mark.mark-closed { color: #bbb; font-size: 14px; }

  /* 凡例 */
  .legend {
    display: flex; gap: 14px; padding: 8px 12px;
    font-size: 11px; color: var(--sub); background: #fff;
    border-top: 1px solid var(--border); justify-content: center; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-mark { font-size: 14px; font-weight: 700; }

  /* ローディング */
  .loading { display: flex; align-items: center; justify-content: center; min-height: 160px; color: var(--sub); gap: 10px; }
  .spinner { width: 18px; height: 18px; border: 2px solid #ddd; border-top-color: var(--teal); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== 予約フォームパネル（下部固定） ========== */
  .booking-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.15);
    transform: translateY(100%);
    transition: transform .3s ease;
    z-index: 200;
    max-width: 480px; margin: 0 auto;
    max-height: 80vh; overflow-y: auto;
  }
  .booking-panel.open { transform: translateY(0); }

  .panel-handle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 8px;
    border-bottom: 1px solid #f0f0f0;
    position: sticky; top: 0; background: #fff; z-index: 1;
  }
  .panel-handle h3 { font-size: 14px; font-weight: 700; color: var(--teal); }
  .panel-close { background: none; border: none; font-size: 18px; color: #aaa; cursor: pointer; padding: 2px 6px; }

  /* 選択日時バッジ */
  .selected-badge {
    margin: 8px 14px;
    background: var(--teal-light); border-radius: 6px;
    padding: 7px 12px; font-size: 13px; color: var(--teal); font-weight: 600;
  }

  /* フォーム本体 */
  .panel-body { padding: 8px 14px 16px; display: flex; flex-direction: column; gap: 12px; }

  .field-label {
    font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 5px;
    display: flex; align-items: center; gap: 4px;
  }
  .req { background: #c0392b; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 3px; }
  .opt { background: #888; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 3px; }

  .text-input {
    width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 11px 12px; font-size: 15px; font-family: var(--font); outline: none;
    transition: border-color .15s;
  }
  .text-input:focus { border-color: var(--teal); }

  .promo-hint { font-size: 11px; color: var(--sub); margin-top: 4px; }
  .promo-ok { color: var(--teal); font-weight: 700; }

  /* 予約ボタン */
  .btn-book {
    width: 100%; background: var(--teal); color: #fff; border: none;
    border-radius: var(--radius); padding: 14px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: background .15s; font-family: var(--font);
  }
  .btn-book:hover { background: #1f5f56; }
  .btn-book:disabled { background: #aaa; cursor: default; }

  /* 完了画面 */
  .done-screen {
    display: none; position: fixed; inset: 0; background: #fff;
    z-index: 300; flex-direction: column; align-items: center;
    justify-content: center; padding: 32px; text-align: center;
  }
  .done-screen.open { display: flex; }
  .done-icon { font-size: 56px; margin-bottom: 12px; }
  .done-screen h2 { font-size: 20px; font-weight: 700; color: var(--teal); margin-bottom: 8px; }
  .done-detail {
    background: var(--teal-light); border-radius: var(--radius);
    padding: 14px 18px; margin: 16px 0;
    width: 100%; max-width: 320px; text-align: left;
  }
  .done-detail p { font-size: 14px; margin-bottom: 6px; }
  .done-detail p span { font-weight: 700; }
  .done-screen > p { color: var(--sub); font-size: 13px; line-height: 1.7; }
  .btn-close {
    background: var(--teal); color: #fff; border: none;
    border-radius: var(--radius); padding: 13px 28px;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px;
  }

  /* トースト */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: all .3s; z-index: 500;
    white-space: nowrap; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🏥 ご予約</h1>
  <span class="today-label" id="headerDate"></span>
</header>

<div id="mainContent">
  <div class="loading">
    <div class="spinner"></div> 読み込み中…
  </div>
</div>

<div class="legend" id="legend" style="display:none">
  <div class="legend-item"><span class="legend-mark" style="color:var(--open-text)">○</span><span>空きあり</span></div>
  <div class="legend-item"><span class="legend-mark" style="color:#e6a817">△</span><span>残りわずか</span></div>
  <div class="legend-item"><span class="legend-mark" style="color:var(--full-text)">×</span><span>満枠</span></div>
  <div class="legend-item"><span class="legend-mark" style="color:#ccc;font-size:12px">－</span><span>受付終了</span></div>
</div>

<!-- 受付時間外画面 -->
<div class="outside-screen" id="outsideScreen">
  <div class="outside-icon">🌙</div>
  <h2>受付時間外です</h2>
  <div class="next-open-badge" id="nextOpenBadge"></div>
  <p>受付時間：毎日 7:00〜23:00<br>時間内に再度お越しください。</p>
</div>

<!-- 下部スライドパネル -->
<div class="booking-panel" id="bookingPanel">
  <div class="panel-handle">
    <h3>予約情報の入力</h3>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="selected-badge" id="selectedBadge"></div>
  <div class="panel-body">

    <!-- 満枠時の案内 -->
    <div class="full-notice" id="fullNotice" style="display:none">
      この時間は満枠です。<br>プロモーションコードをお持ちの方のみ予約できます。
    </div>

    <!-- 氏名 -->
    <div>
      <div class="field-label">👤 お名前 <span class="req">必須</span></div>
      <input type="text" class="text-input" id="inputName"
        placeholder="例：山田 太郎"
        oninput="validateForm()">
    </div>

    <!-- プロモーションコード -->
    <div>
      <div class="field-label">🎟️ プロモーションコード <span class="opt">任意</span></div>
      <input type="text" class="text-input" id="inputPromo"
        placeholder="お持ちの方は入力してください"
        oninput="onPromoInput()">
      <div class="promo-hint" id="promoHint"></div>
    </div>

    <!-- 予約ボタン -->
    <button class="btn-book" id="btnBook" onclick="submitBooking()" disabled>予約を確定する</button>
  </div>
</div>

<!-- 完了画面 -->
<div class="done-screen" id="doneScreen">
  <div class="done-icon">✅</div>
  <h2>予約完了！</h2>
  <div class="done-detail" id="doneDetail"></div>
  <p>前日にリマインドをお送りします。</p>
  <button class="btn-close" onclick="closeDone()">閉じる</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 設定
// ============================================================
const GAS_URL        = 'https://script.google.com/macros/s/AKfycbw-JsEZlCOe6FeItSrj18jK2hOx84rRzSBqpLId6eyDH5--pgEkxJiPWsx09ln82wMf/exec';
const LIFF_ID        = '2010369051-b9OGqRDi';
const MAX_PER_SLOT   = 5;
const SLOT_MIN       = 60; // 1時間刻み
const HOUR_OPEN      = 7;  // 受付開始（この時間から予約できる）
const HOUR_CLOSE     = 23; // 受付終了（この時間以降は受付時間外）
const DAY_START      = 9;  // 営業開始（予約枠の最初）
const DAY_END        = 24; // 営業終了（予約枠の最後は23:00〜24:00）
const WARN_THRESHOLD = 2;  // 残り△表示の閾値
// 有効なプロモーションコード（定員オーバー時も予約可能）
const PROMO_CODES    = ['事故', '即'];

const DAY_NAMES = ['日','月','火','水','木','金','土'];

let userId       = null;
let slotsData    = {};
let selectedDate = null;
let selectedTime = null;
let selectedItem = null; // 選択中のDOM要素
let promoValid   = false;
let CLOSED_DAYS  = [];
let HOLIDAY_DATES = [];
let closedSlots  = {};   // 受付終了に設定された時間 { 'yyyy-MM-dd': ['10:00', ...] }
let limitsData   = {};   // 枠ごとの上限（上限設定シート） { 'yyyy-MM-dd': { '10:00': 5, ... } }
let selectedFull = false; // 選択中の枠が満枠か

// ============================================================
// 初期化
// ============================================================
async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      const p = await liff.getProfile();
      userId = p.userId;
    } else { liff.login(); return; }
  } catch(e) { userId = 'TEST_USER'; }

  // 受付時間チェック
  const now  = new Date();
  const hour = now.getHours();
  if (hour < HOUR_OPEN || hour >= HOUR_CLOSE) {
    showOutsideScreen();
    return;
  }

  updateHeaderDate(now);
  await loadTodaySlots();
}

function showOutsideScreen() {
  const now = new Date();
  const hour = now.getHours();
  let msg;
  if (hour >= HOUR_CLOSE) {
    msg = `次の受付開始：翌朝 ${HOUR_OPEN}:00`;
  } else {
    msg = `本日の受付開始：${HOUR_OPEN}:00`;
  }
  document.getElementById('nextOpenBadge').textContent = '🕐 ' + msg;
  document.getElementById('outsideScreen').classList.add('open');
}

function updateHeaderDate(now) {
  const month = now.getMonth() + 1;
  const day   = now.getDate();
  const dname = DAY_NAMES[now.getDay()];
  document.getElementById('headerDate').textContent = `${month}/${day}（${dname}）`;
}

// ============================================================
// 当日スロット取得・表示
// ============================================================
async function loadTodaySlots() {
  document.getElementById('mainContent').innerHTML =
    '<div class="loading"><div class="spinner"></div> 読み込み中…</div>';

  const today = formatDate(new Date());
  try {
    const res  = await fetch(`${GAS_URL}?action=getSlots&dates=${today}&userId=${userId}`);
    const data = await res.json();
    slotsData     = data.slots || {};
    closedSlots   = data.closed || {};
    CLOSED_DAYS   = Array.isArray(data.closedDays) ? data.closedDays.map(Number) : [];
    HOLIDAY_DATES = data.holiday_dates ? String(data.holiday_dates).split(',').map(s => s.trim()).filter(s => s) : [];
    limitsData    = data.limits || {};
  } catch(e) {
    slotsData = {};
  }

  renderTodaySlots(today);
  document.getElementById('legend').style.display = 'flex';
}

function renderTodaySlots(today) {
  const now    = new Date();
  const todayDate = new Date(today + 'T00:00:00');
  const month  = todayDate.getMonth() + 1;
  const day    = todayDate.getDate();
  const dname  = DAY_NAMES[todayDate.getDay()];

  const isClosed  = CLOSED_DAYS.includes(todayDate.getDay());
  const isHoliday = HOLIDAY_DATES.includes(today);

  let html = '<div class="slots-wrap">';

  // 日付ヘッダー
  html += `<div class="date-header">
    <div>
      <div class="date-header-main">📅 ${month}月${day}日（${dname}）</div>
      <div class="date-header-sub">本日の予約受付</div>
    </div>
  </div>`;

  // 休業日
  if (isClosed || isHoliday) {
    html += `<div class="reception-closed-notice">🏖️ 本日は休業日です</div>`;
    html += '</div>';
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  // スロット一覧
  html += '<div class="slots-grid">';
  const slots = generateTimeSlots();
  slots.forEach(time => {
    // 枠の終了時刻を過ぎたら受付終了（現在進行中の時間帯はまだ予約可能）
    const endDt  = new Date(today + 'T' + calcEndTime(time) + ':00');
    const isPast = endDt <= now;
    const limit  = limitsData[today]?.[time] ?? MAX_PER_SLOT;
    // 上限0の枠も受付不可として扱う
    const isClosedSlot = (closedSlots[today] || []).includes(time) || limit === 0;
    const count  = slotsData[today]?.[time] ?? 0;
    // サーバーは満枠の枠のcountをMAX_PER_SLOTにして返す
    const remaining = count >= MAX_PER_SLOT ? 0 : Math.max(0, limit - count);

    let cls, markCls, mark;
    if (isPast) {
      cls = 'past'; markCls = 'mark-past'; mark = '－';
    } else if (isClosedSlot) {
      cls = 'closed-slot'; markCls = 'mark-closed'; mark = '受付終了';
    } else if (remaining <= 0) {
      cls = 'full'; markCls = 'mark-full'; mark = '×';
    } else if (remaining <= WARN_THRESHOLD) {
      cls = 'warn'; markCls = 'mark-warn'; mark = '△';
    } else {
      cls = 'open'; markCls = 'mark-open'; mark = '○';
    }

    // 満枠でもタップ可能（プロモーションコード入力時のみ予約できる）
    const canSelect = !isPast && !isClosedSlot;
    const endTime   = calcEndTime(time);
    const onclick   = canSelect ? `onclick="selectSlot('${today}','${time}',${remaining <= 0},this)"` : '';

    html += `<div class="slot-item ${cls}" ${onclick} data-date="${today}" data-time="${time}">
      <div class="slot-time">${time}〜${endTime}</div>
      <div class="slot-mark ${markCls}">${mark}</div>
      ${(cls === 'open' || cls === 'warn') ? `<div style="font-size:11px;color:var(--sub)">残り${remaining}枠</div>` : ''}
    </div>`;
  });
  html += '</div></div>';

  document.getElementById('mainContent').innerHTML = html;
}

function generateTimeSlots() {
  const slots = [];
  for (let h = DAY_START; h < DAY_END; h++) {
    slots.push(`${String(h).padStart(2,'0')}:00`);
  }
  return slots;
}

// ============================================================
// 枠選択 → パネル表示
// ============================================================
function selectSlot(date, time, isFull, el) {
  // 以前の選択を解除
  if (selectedItem && selectedItem !== el) selectedItem.classList.remove('selected');
  selectedItem = el;
  el.classList.add('selected');

  selectedDate = date;
  selectedTime = time;
  selectedFull = !!isFull;
  document.getElementById('fullNotice').style.display = selectedFull ? '' : 'none';

  const d = new Date(date + 'T00:00:00');
  document.getElementById('selectedBadge').textContent =
    `📅 ${d.getMonth()+1}月${d.getDate()}日（${DAY_NAMES[d.getDay()]}）　🕐 ${time}〜${calcEndTime(time)}`;

  // フォームリセット
  document.getElementById('inputName').value  = '';
  document.getElementById('inputPromo').value = '';
  document.getElementById('promoHint').textContent = '';
  promoValid = false;
  validateForm();

  document.getElementById('bookingPanel').classList.add('open');
  setTimeout(() => document.getElementById('inputName').focus(), 350);
}

function closePanel() {
  document.getElementById('bookingPanel').classList.remove('open');
  if (selectedItem) { selectedItem.classList.remove('selected'); selectedItem = null; }
  selectedDate = null; selectedTime = null;
}

// ============================================================
// プロモーションコード
// ============================================================
function onPromoInput() {
  const val  = document.getElementById('inputPromo').value.trim();
  const hint = document.getElementById('promoHint');
  if (!val) {
    hint.textContent = '';
    promoValid = false;
  } else if (PROMO_CODES.includes(val)) {
    hint.innerHTML = '<span class="promo-ok">✅ 有効なコードです</span>';
    promoValid = true;
  } else {
    hint.textContent = '❌ 無効なコードです';
    promoValid = false;
  }
  validateForm();
}

// ============================================================
// バリデーション
// ============================================================
function validateForm() {
  const name = document.getElementById('inputName').value.trim();
  // 満枠の枠はコードが有効なときだけ予約できる
  document.getElementById('btnBook').disabled = !name || (selectedFull && !promoValid);
}

// ============================================================
// 予約送信
// ============================================================
async function submitBooking() {
  const btn  = document.getElementById('btnBook');
  const name  = document.getElementById('inputName').value.trim().replace(/,/g, '、');
  const promo = document.getElementById('inputPromo').value.trim();

  if (!name) { showToast('お名前を入力してください'); return; }
  if (selectedFull && !PROMO_CODES.includes(promo)) { showToast('満枠のためコードが必要です'); return; }

  btn.disabled = true; btn.textContent = '送信中…';

  try {
    const params = new URLSearchParams({
      action: 'book',
      userId,
      date: selectedDate,
      time: selectedTime,
      names: name,
      promoCode: promo,
    });
    await fetch(`${GAS_URL}?${params.toString()}`, { mode: 'no-cors' });
    // no-corsではレスポンス読めないので2秒待ってリロード
    await new Promise(r => setTimeout(r, 2000));
    closePanel();
    showDone({ date: selectedDate, time: selectedTime, name });
    await loadTodaySlots();
  } catch(e) {
    showToast('通信エラーが発生しました');
    btn.disabled = false; btn.textContent = '予約を確定する';
  }
}

// ============================================================
// 完了画面
// ============================================================
function showDone({ date, time, name }) {
  const d = new Date(date + 'T00:00:00');
  document.getElementById('doneDetail').innerHTML = `
    <p>📅 <span>${d.getMonth()+1}月${d.getDate()}日（${DAY_NAMES[d.getDay()]}）</span></p>
    <p>🕐 <span>${time}〜${calcEndTime(time)}</span></p>
    <p>👤 <span>${name} 様</span></p>
  `;
  document.getElementById('doneScreen').classList.add('open');
}

function closeDone() {
  document.getElementById('doneScreen').classList.remove('open');
  if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow();
}

// ============================================================
// ユーティリティ
// ============================================================
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function calcEndTime(time) {
  const [h,m] = time.split(':').map(Number);
  const t = h*60+m+SLOT_MIN;
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

init();
</script>
